[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Overridden by DATABASE_URL in alembic/env.py. The value here only lets
# `alembic upgrade head --sql` render offline SQL without a live database.
sqlalchemy.url = postgresql+psycopg://asuntohaku:asuntohaku@localhost:5432/asuntohaku

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
